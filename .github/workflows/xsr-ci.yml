name: XSR CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-chrome:
    name: Windows native window and tray restoration
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Prepare pinned plugin SDK packages
        run: python eng/plugins/prepare.py
      - name: Record native desktop environment
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          Get-Process -Id $PID | Select-Object ProcessName, SessionId
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion
      - name: Build native window probe
        run: dotnet build tests/rendering/Nexa.Xsr.Renderer.Backend.Avalonia.Tests -c Release
      - name: Verify native WinRT share package and stream ownership
        run: dotnet tests/rendering/Nexa.Xsr.Renderer.Backend.Avalonia.Tests/bin/Release/net10.0/Nexa.Xsr.Renderer.Backend.Avalonia.Tests.dll --native-share-package-smoke
      - name: Exercise actual Win32 decorations and tray restoration
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-native-chrome.log'
          & dotnet tests/rendering/Nexa.Xsr.Renderer.Backend.Avalonia.Tests/bin/Release/net10.0/Nexa.Xsr.Renderer.Backend.Avalonia.Tests.dll --native-corner-smoke *> $log
          $probeExitCode = $LASTEXITCODE
          Get-Content $log
          exit $probeExitCode
      - name: Retain native window evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-chrome
          path: ${{ runner.temp }}/windows-native-chrome.log
          if-no-files-found: warn
          retention-days: 14

  macos-intel-presentation:
    name: Backend presentation contracts (macOS Intel)
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Prepare pinned plugin SDK packages
        run: python eng/plugins/prepare.py
      - name: Verify backend motion, input and resource lifetime before packaging
        run: dotnet run --project tests/rendering/Nexa.Xsr.Renderer.Backend.Avalonia.Tests -c Release

  sidecar-ipc:
    name: NativeAOT Sidecar full lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Prepare pinned plugin SDK packages
        run: python eng/plugins/prepare.py
      - name: Publish NativeAOT Sidecar tests
        run: dotnet publish tests/sidecar/Nexa.Sidecar.Tests -c Release -p:PublishAot=true -p:StripSymbols=true -o native-sidecar-tests
      - name: Exercise native protocol and IPC without skips
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-sidecar-tests/Nexa.Sidecar.Tests.exe' } else { './native-sidecar-tests/Nexa.Sidecar.Tests' }
          & $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish NativeAOT Sidecar Host tests
        run: dotnet publish tests/runtime/Nexa.Xsr.Runtime.Tests -c Release -p:PublishAot=true -p:StripSymbols=true -o native-sidecar-host-tests
      - name: Exercise native Host API and physical package lifecycle
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-sidecar-host-tests/Nexa.Xsr.Runtime.Tests.exe' } else { './native-sidecar-host-tests/Nexa.Xsr.Runtime.Tests' }
          & $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  jvm-host:
    name: NativeAOT JNI host (${{ matrix.os }}, Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        java: ['8', '17', '21', '25']
        include:
          - {os: macos-15, java: '21'}
          - {os: macos-15-intel, java: '21'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Prepare pinned plugin SDK packages
        run: python eng/plugins/prepare.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Publish isolated JNI host
        run: dotnet publish src/app/Nexa.Jvm.Host -c Release -p:PublishAot=true -o native-jvm-host
      - name: Exercise real JVM lifecycle
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-jvm-host/Nexa.Jvm.Host.exe' } else { './native-jvm-host/Nexa.Jvm.Host' }
          ./eng/xsr/Test-JvmHost.ps1 -HostExecutable $binary -JavaHome $env:JAVA_HOME
          ./eng/xsr/Test-JvmModCompatibility.ps1 -HostExecutable $binary -JavaHome $env:JAVA_HOME

  account-security:
    name: Native account protection (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXA_TEST_SYSTEM_KEYRING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Prepare pinned plugin SDK packages
        run: python eng/plugins/prepare.py
      - name: Prepare Linux keyring
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11 clang zlib1g-dev
      - name: Prepare disposable macOS keychain
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: |
          set -x
          security create-keychain -p '' "$RUNNER_TEMP/nexa-test.keychain-db"
          security unlock-keychain -p '' "$RUNNER_TEMP/nexa-test.keychain-db"
          security set-keychain-settings -t 21600 "$RUNNER_TEMP/nexa-test.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/nexa-test.keychain-db"
      - name: Publish NativeAOT account tests
        run: dotnet publish tests/app/Nexa.Services.Tests -c Release -p:PublishAot=true -o native-account-tests
      - name: Verify Windows memory cleanup and protected process identity under NativeAOT
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./native-account-tests/Nexa.Services.Tests.exe "memory cleanup" "memory deep cleanup" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-memory-cleanup.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare native memory cleanup with pinned Mem Reduct on a controlled workload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'memreduct-3.5.2-bin.7z'
          $fixture = Join-Path $env:RUNNER_TEMP 'memory-comparison-baseline'
          Invoke-WebRequest 'https://github.com/henrypp/memreduct/releases/download/v.3.5.2/memreduct-3.5.2-bin.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'EC41CA15FF623F53850D9EE01986D3F8FF457EC93457A6CEEB993B7164023D15') { throw 'Memory baseline archive hash mismatch.' }
          & 'C:\Program Files\7-Zip\7z.exe' x $archive "-o$fixture" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $baseline = Get-ChildItem $fixture -Filter memreduct.exe -Recurse | Where-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash -eq 'DD55A81D56E8C32918E5190B2EC2A1F2A7EDBBCA884627439B4B619FDFB5602D' } | Select-Object -First 1
          if ($null -eq $baseline) { throw 'Pinned x64 memory baseline executable is missing.' }
          ./native-account-tests/Nexa.Services.Tests.exe --memory-compare $baseline.FullName 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-memory-comparison.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Windows native memory operation measurements
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-memory-cleanup
          path: |
            ${{ runner.temp }}/windows-memory-cleanup.log
            ${{ runner.temp }}/windows-memory-comparison.log
          if-no-files-found: error
          retention-days: 14
      - name: Verify exported launch scripts with Unicode paths
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "launch scripts preserve Unicode paths" "instance content admits system aliases only"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native launcher migration and SQLite source snapshots
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "LauncherMigration"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native resource policies and independent file clones
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "topology" "power pressure" "native clones" "network cost" "GameMode" "native snapshot capture" "Steam shortcuts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real Btrfs snapshot isolation and cleanup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs
          truncate -s 512M "$RUNNER_TEMP/nexa-snapshot.img"
          mkfs.btrfs -f "$RUNNER_TEMP/nexa-snapshot.img"
          mkdir "$RUNNER_TEMP/nexa-snapshot-mount"
          sudo mount -o loop "$RUNNER_TEMP/nexa-snapshot.img" "$RUNNER_TEMP/nexa-snapshot-mount"
          trap 'sudo umount "$RUNNER_TEMP/nexa-snapshot-mount"' EXIT
          sudo btrfs subvolume create "$RUNNER_TEMP/nexa-snapshot-mount/source"
          sudo ./native-account-tests/Nexa.Services.Tests --native-directory-snapshot "$RUNNER_TEMP/nexa-snapshot-mount"
      - name: Verify native session logs and Minecraft launch recovery
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "session logs" "Microsoft Minecraft" "Microsoft refresh" "modern native artifacts" "arm64 native" "mainland completion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise native input discovery without hooks
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "native input probe" "Linux input"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native macOS memory query envelope
        if: runner.os == 'macOS'
        run: ./native-account-tests/Nexa.Services.Tests "Mac memory probe"
      - name: Verify NativeAOT proxy and PAC routing
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "PAC " "proxy settings" "network proxy" "SOCKS authenticated"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows native protection
        if: runner.os == 'Windows'
        run: ./native-account-tests/Nexa.Services.Tests.exe "native profile protection"
      - name: Verify native update archive permissions
        # Archive modes share the same cross-platform NativeAOT test binary.
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "update modes" "protected update"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify elevated Windows update objects
        if: runner.os == 'Windows'
        env:
          NEXA_TEST_PROTECTED_UPDATES: '1'
        run: ./native-account-tests/Nexa.Services.Tests.exe "Windows protected update"
      - name: Run macOS native protection
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: |
          set -x
          security unlock-keychain -p '' "$RUNNER_TEMP/nexa-test.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/nexa-test.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/nexa-test.keychain-db"
          security set-keychain-settings -t 21600 "$RUNNER_TEMP/nexa-test.keychain-db"
          ./native-account-tests/Nexa.Services.Tests "native profile protection"
      - name: Remove disposable macOS keychain
        if: always() && runner.os == 'macOS'
        timeout-minutes: 1
        run: |
          set -x
          if [ -f "$RUNNER_TEMP/nexa-test.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/nexa-test.keychain-db"
          fi
      - name: Run Linux native protection
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh -c 'printf "\n" | gnome-keyring-daemon --unlock; ./native-account-tests/Nexa.Services.Tests "native profile protection"'
  theme-publication:
    name: NTP/1 NativeAOT publication (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Prepare pinned plugin SDK packages
        run: python eng/plugins/prepare.py
      - name: Prepare Linux native compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev xvfb libx11-6 ffmpeg
      - name: Prepare Windows media decoder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare macOS media decoder
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version
      - name: Publish NativeAOT NTP services
        run: dotnet publish tests/modules/themes/Nexa.Services.Themes.Tests/Nexa.Services.Themes.Tests.csproj --configuration Release -p:PublishAot=true -p:StripSymbols=true --output native-theme-services
      - name: Exercise published source, transaction and resource contracts
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-theme-services/Nexa.Services.Themes.Tests.exe' } else { './native-theme-services/Nexa.Services.Themes.Tests' }
          $log = Join-Path $env:RUNNER_TEMP 'ntp-native-services.log'
          & $binary *> $log
          $probeExitCode = $LASTEXITCODE
          Get-Content $log
          exit $probeExitCode
      - name: Publish NativeAOT Desktop theme host
        run: dotnet publish src/app/Nexa.Desktop/Nexa.Desktop.csproj --configuration Release -p:XsrVersionChannel=ci -p:PublishAot=true -p:StripSymbols=true --output native-theme-desktop
      - name: Verify external author assets and execute actual published theme host
        shell: pwsh
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python eng/themes/pack.py src/app/Nexa.Desktop/Themes --verify-published native-theme-desktop/Themes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = if ($IsWindows) { './native-theme-desktop/Nexa.Desktop.exe' } else { './native-theme-desktop/Nexa.Desktop' }
          $log = Join-Path $env:RUNNER_TEMP 'ntp-native-publication.log'
          & $binary --validate-themes *> $log
          $probeExitCode = $LASTEXITCODE
          Get-Content $log
          exit $probeExitCode
      - name: Build actual native NTP preview harness
        run: dotnet build tests/app/Nexa.Desktop.Tests/Nexa.Desktop.Tests.csproj --configuration Release
      - name: Verify gamepad polling survives background composition
        shell: pwsh
        run: |
          if ($IsLinux) {
            & xvfb-run -a dotnet tests/app/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-gamepad-polling-smoke
          } else {
            & dotnet tests/app/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-gamepad-polling-smoke
          }
          exit $LASTEXITCODE
      - name: Capture native memory cleanup card in light and dark themes
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'ntp-native-previews'
          if ($IsLinux) {
            & xvfb-run -a dotnet tests/app/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-memory-preview $output
          } else {
            & dotnet tests/app/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-memory-preview $output
          }
          exit $LASTEXITCODE
      - name: Capture native light and dark themes with actual runtime interactions
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'ntp-native-previews'
          foreach ($mode in @('light', 'dark')) {
            $log = Join-Path $env:RUNNER_TEMP "ntp-native-preview-$mode.log"
            if ($IsLinux) {
              & xvfb-run -a dotnet tests/app/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-theme-preview $mode $output *> $log
            } else {
              & dotnet tests/app/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-theme-preview $mode $output *> $log
            }
            $probeExitCode = $LASTEXITCODE
            Get-Content $log
            if ($probeExitCode -ne 0) { exit $probeExitCode }
            $migrationOutput = Join-Path $output 'launcher-migration'
            $migrationLog = Join-Path $env:RUNNER_TEMP "ntp-native-preview-migration-$mode.log"
            if ($IsLinux) {
              & xvfb-run -a dotnet tests/app/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-launcher-migration-preview $mode $migrationOutput *> $migrationLog
            } else {
              & dotnet tests/app/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-launcher-migration-preview $mode $migrationOutput *> $migrationLog
            }
            $probeExitCode = $LASTEXITCODE
            Get-Content $migrationLog
            if ($probeExitCode -ne 0) { exit $probeExitCode }
          }
      - name: Retain platform theme publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ntp-native-publication-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ntp-native-services.log
            ${{ runner.temp }}/ntp-native-publication.log
            ${{ runner.temp }}/ntp-native-preview-*.log
            ${{ runner.temp }}/ntp-native-previews/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build and architecture gates
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Verify CI commit version restore and product identity
        run: python3 eng/xsr/test_version.py

      - name: Verify repository layout and documentation
        run: python3 eng/architecture/verify_layout.py
      - name: Verify plugin SDK feed integrity boundaries
        run: python3 eng/plugins/test_prepare.py
      - name: Prepare pinned plugin SDK packages
        run: python3 eng/plugins/prepare.py
      - name: Restore
        run: dotnet restore NexaCL.slnx

      - name: Build
        run: dotnet build NexaCL.slnx --configuration Release --no-restore -p:XsrVersionChannel=ci

      - name: Verify general Sidecar business ABI generation
        run: |
          python3 eng/xsr/generate_service_wire.py --assembly src/sidecar/Nexa.Sidecar.Protocol/bin/Release/net10.0/Nexa.Sidecar.Protocol.dll --roots eng/sidecar/ui-forms-roots.txt --output src/sidecar/Nexa.Sidecar.Protocol/Forms/FormWire.Generated.cs --namespace Nexa.Sidecar.Protocol.Forms.Wire --check
          python3 eng/sidecar/generate_host_business.py --verify
          python3 eng/sidecar/generate_host_business.py --catalog host-effects.json --verify
          python3 eng/sidecar/generate_host_business.py --catalog host-presentation.json --verify
          python3 eng/sidecar/generate_host_business.py --catalog host-viewstate.json --verify
          python3 eng/sidecar/generate_host_business.py --catalog host-pagecontrol.json --verify
          python3 eng/sidecar/generate_host_business.py --catalog host-confirmation.json --verify
          python3 eng/sidecar/generate_host_business.py --catalog host-shell.json --verify
          python3 eng/sidecar/generate_host_business.py --catalog host-themeoptions.json --verify
          python3 eng/sidecar/generate_host_business.py --catalog host-themeactivation.json --verify
          python3 eng/sidecar/generate_host_business.py --catalog host-notifications.json --verify
          python3 eng/xsr/generate_service_wire.py --assembly src/app/Nexa.Services.Composition/bin/Release/net10.0/Nexa.Services.dll --roots eng/sidecar/host-business-roots.txt --output src/app/Nexa.Services.Composition/Composition/Sidecars/BusinessWire.Generated.cs --namespace Nexa.Sidecar.Host.Wire --sidecar-contracts src/sidecar/Nexa.Sidecar.Host.Contracts --check

          python3 eng/xsr/generate_service_wire.py --assembly src/app/Nexa.Services.Composition/bin/Release/net10.0/Nexa.Services.Composition.dll --roots eng/sidecar/host-effects-roots.txt --output src/app/Nexa.Services.Composition/Composition/Sidecars/Effects/BusinessWire.Generated.cs --namespace Nexa.Sidecar.Host.Effects.Wire --sidecar-contracts src/sidecar/Nexa.Sidecar.Host.Contracts/Effects --sidecar-data-namespace Nexa.Sidecar.Host.Effects.Data --check
          python3 eng/xsr/generate_service_wire.py --assembly src/app/Nexa.Services.Composition/bin/Release/net10.0/Nexa.Services.Composition.dll --roots eng/sidecar/host-presentation-roots.txt --output src/app/Nexa.Services.Composition/Composition/Sidecars/Presentation/BusinessWire.Generated.cs --namespace Nexa.Sidecar.Host.Presentation.Wire --sidecar-contracts src/sidecar/Nexa.Sidecar.Host.Contracts/Presentation --sidecar-data-namespace Nexa.Sidecar.Host.Presentation.Data --check

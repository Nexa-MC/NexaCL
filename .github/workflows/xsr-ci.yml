name: XSR CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-chrome:
    name: Windows native window and tray restoration
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Record native desktop environment
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          Get-Process -Id $PID | Select-Object ProcessName, SessionId
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion
      - name: Build native window probe
        run: dotnet build tests/Nexa.Xsr.Renderer.Backend.Avalonia.Tests -c Release
      - name: Verify native WinRT share package and stream ownership
        run: dotnet tests/Nexa.Xsr.Renderer.Backend.Avalonia.Tests/bin/Release/net10.0/Nexa.Xsr.Renderer.Backend.Avalonia.Tests.dll --native-share-package-smoke
      - name: Exercise actual Win32 decorations and tray restoration
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-native-chrome.log'
          & dotnet tests/Nexa.Xsr.Renderer.Backend.Avalonia.Tests/bin/Release/net10.0/Nexa.Xsr.Renderer.Backend.Avalonia.Tests.dll --native-corner-smoke *> $log
          $probeExitCode = $LASTEXITCODE
          Get-Content $log
          exit $probeExitCode
      - name: Retain native window evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-chrome
          path: ${{ runner.temp }}/windows-native-chrome.log
          if-no-files-found: warn
          retention-days: 14

  sidecar-ipc:
    name: NativeAOT Sidecar full lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Publish NativeAOT Sidecar tests
        run: dotnet publish tests/Nexa.Sidecar.Tests -c Release -p:PublishAot=true -p:StripSymbols=true -o native-sidecar-tests
      - name: Exercise native protocol and IPC without skips
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-sidecar-tests/Nexa.Sidecar.Tests.exe' } else { './native-sidecar-tests/Nexa.Sidecar.Tests' }
          & $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish NativeAOT Sidecar Host tests
        run: dotnet publish tests/Nexa.Xsr.Runtime.Tests -c Release -p:PublishAot=true -p:StripSymbols=true -o native-sidecar-host-tests
      - name: Exercise native Host API and physical package lifecycle
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-sidecar-host-tests/Nexa.Xsr.Runtime.Tests.exe' } else { './native-sidecar-host-tests/Nexa.Xsr.Runtime.Tests' }
          & $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  jvm-host:
    name: NativeAOT JNI host (${{ matrix.os }}, Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        java: ['8', '17', '21', '25']
        include:
          - {os: macos-15, java: '21'}
          - {os: macos-15-intel, java: '21'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Publish isolated JNI host
        run: dotnet publish Nexa.Jvm.Host -c Release -p:PublishAot=true -o native-jvm-host
      - name: Exercise real JVM lifecycle
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-jvm-host/Nexa.Jvm.Host.exe' } else { './native-jvm-host/Nexa.Jvm.Host' }
          ./eng/xsr/Test-JvmHost.ps1 -HostExecutable $binary -JavaHome $env:JAVA_HOME
          ./eng/xsr/Test-JvmModCompatibility.ps1 -HostExecutable $binary -JavaHome $env:JAVA_HOME

  account-security:
    name: Native account protection (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXA_TEST_SYSTEM_KEYRING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Prepare Linux keyring
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11 clang zlib1g-dev
      - name: Prepare disposable macOS keychain
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: |
          set -x
          security create-keychain -p '' "$RUNNER_TEMP/nexa-test.keychain-db"
          security unlock-keychain -p '' "$RUNNER_TEMP/nexa-test.keychain-db"
          security set-keychain-settings -t 21600 "$RUNNER_TEMP/nexa-test.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/nexa-test.keychain-db"
      - name: Publish NativeAOT account tests
        run: dotnet publish tests/Nexa.Services.Tests -c Release -p:PublishAot=true -o native-account-tests
      - name: Verify native launcher migration and SQLite source snapshots
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "LauncherMigration"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native resource policies and independent file clones
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "topology" "power pressure" "native clones" "network cost" "GameMode"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native session log ownership and Minecraft session retry
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "session logs" "Microsoft Minecraft"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise native input discovery without hooks
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "native input probe" "Linux input"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native macOS memory query envelope
        if: runner.os == 'macOS'
        run: ./native-account-tests/Nexa.Services.Tests "Mac memory probe"
      - name: Verify NativeAOT proxy and PAC routing
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "PAC " "proxy settings" "network proxy" "SOCKS authenticated"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows native protection
        if: runner.os == 'Windows'
        run: ./native-account-tests/Nexa.Services.Tests.exe "native profile protection"
      - name: Verify native update archive permissions
        # Archive modes share the same cross-platform NativeAOT test binary.
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-account-tests/Nexa.Services.Tests.exe' } else { './native-account-tests/Nexa.Services.Tests' }
          & $binary "update modes" "protected update"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify elevated Windows update objects
        if: runner.os == 'Windows'
        env:
          NEXA_TEST_PROTECTED_UPDATES: '1'
        run: ./native-account-tests/Nexa.Services.Tests.exe "Windows protected update"
      - name: Run macOS native protection
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: |
          set -x
          security unlock-keychain -p '' "$RUNNER_TEMP/nexa-test.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/nexa-test.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/nexa-test.keychain-db"
          security set-keychain-settings -t 21600 "$RUNNER_TEMP/nexa-test.keychain-db"
          ./native-account-tests/Nexa.Services.Tests "native profile protection"
      - name: Remove disposable macOS keychain
        if: always() && runner.os == 'macOS'
        timeout-minutes: 1
        run: |
          set -x
          if [ -f "$RUNNER_TEMP/nexa-test.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/nexa-test.keychain-db"
          fi
      - name: Run Linux native protection
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh -c 'printf "\n" | gnome-keyring-daemon --unlock; ./native-account-tests/Nexa.Services.Tests "native profile protection"'
  theme-publication:
    name: NTP/1 NativeAOT publication (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Prepare Linux native compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev xvfb libx11-6 ffmpeg
      - name: Prepare Windows media decoder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare macOS media decoder
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version
      - name: Publish NativeAOT NTP services
        run: dotnet publish tests/Nexa.Services.Themes.Tests/Nexa.Services.Themes.Tests.csproj --configuration Release -p:PublishAot=true -p:StripSymbols=true --output native-theme-services
      - name: Exercise published source, transaction and resource contracts
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-theme-services/Nexa.Services.Themes.Tests.exe' } else { './native-theme-services/Nexa.Services.Themes.Tests' }
          & $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish NativeAOT Desktop theme host
        run: dotnet publish Nexa.Desktop/Nexa.Desktop.csproj --configuration Release -p:XsrVersionChannel=ci -p:PublishAot=true -p:StripSymbols=true --output native-theme-desktop
      - name: Verify external author assets and execute actual published theme host
        shell: pwsh
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python eng/themes/pack.py Nexa.Desktop/Themes --verify-published native-theme-desktop/Themes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = if ($IsWindows) { './native-theme-desktop/Nexa.Desktop.exe' } else { './native-theme-desktop/Nexa.Desktop' }
          $log = Join-Path $env:RUNNER_TEMP 'ntp-native-publication.log'
          & $binary --validate-themes *> $log
          $probeExitCode = $LASTEXITCODE
          Get-Content $log
          exit $probeExitCode
      - name: Build actual native NTP preview harness
        run: dotnet build tests/Nexa.Desktop.Tests/Nexa.Desktop.Tests.csproj --configuration Release
      - name: Verify gamepad polling survives background composition
        shell: pwsh
        run: |
          if ($IsLinux) {
            & xvfb-run -a dotnet tests/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-gamepad-polling-smoke
          } else {
            & dotnet tests/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-gamepad-polling-smoke
          }
          exit $LASTEXITCODE
      - name: Capture native light and dark themes with actual runtime interactions
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'ntp-native-previews'
          foreach ($mode in @('light', 'dark')) {
            $log = Join-Path $env:RUNNER_TEMP "ntp-native-preview-$mode.log"
            if ($IsLinux) {
              & xvfb-run -a dotnet tests/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-theme-preview $mode $output *> $log
            } else {
              & dotnet tests/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-theme-preview $mode $output *> $log
            }
            $probeExitCode = $LASTEXITCODE
            Get-Content $log
            if ($probeExitCode -ne 0) { exit $probeExitCode }
            $migrationOutput = Join-Path $output 'launcher-migration'
            $migrationLog = Join-Path $env:RUNNER_TEMP "ntp-native-preview-migration-$mode.log"
            if ($IsLinux) {
              & xvfb-run -a dotnet tests/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-launcher-migration-preview $mode $migrationOutput *> $migrationLog
            } else {
              & dotnet tests/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --native-launcher-migration-preview $mode $migrationOutput *> $migrationLog
            }
            $probeExitCode = $LASTEXITCODE
            Get-Content $migrationLog
            if ($probeExitCode -ne 0) { exit $probeExitCode }
          }
      - name: Retain platform theme publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ntp-native-publication-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ntp-native-publication.log
            ${{ runner.temp }}/ntp-native-preview-*.log
            ${{ runner.temp }}/ntp-native-previews/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build and architecture gates
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NexaCL.slnx

      - name: Build
        run: dotnet build NexaCL.slnx --configuration Release --no-restore -p:XsrVersionChannel=ci

      - name: Validate external NXML component bundle
        shell: bash
        run: |
          test -f Nexa.Desktop/bin/Release/net10.0/Ui/Shell.nxml
          test -f Nexa.Desktop/bin/Release/net10.0/Ui/Components/Button.c.nxml
          test -f Nexa.Desktop/bin/Release/net10.0/Ui/Styles/Desktop.nss

      - name: Test compile-time Function Patch rewriting
        run: dotnet run --project tools/Nexa.Xsr.Patch.Compiler --configuration Release --no-build -- --self-test

      - name: Test automatic function signatures and phases
        run: dotnet run --project tools/Nexa.Xsr.Patch.Compiler --configuration Release --no-build -- --self-test-automatic --core Nexa.Core/bin/Release/net10.0/Nexa.Core.dll

      - name: Measure automatic function fast path
        run: dotnet run --project tools/Nexa.Xsr.Patch.Compiler --configuration Release --no-build -- --benchmark-automatic --core Nexa.Core/bin/Release/net10.0/Nexa.Core.dll

      - name: Verify automatic product function coverage
        run: dotnet run --project tools/Nexa.Xsr.Patch.Compiler --configuration Release --no-build -- --verify-automatic Nexa.Desktop/bin/Release/net10.0

      - name: Test Function Patch compile-item path identity
        run: dotnet msbuild eng/xsr/Test.FunctionPatchItems.proj -nologo

      - name: Test XSR runtime kernel and Sidecar host data plane
        run: dotnet run --project tests/Nexa.Xsr.Runtime.Tests/Nexa.Xsr.Runtime.Tests.csproj --configuration Release --no-build

      - name: Publish and run NativeAOT runtime tests
        run: |
          dotnet publish tests/Nexa.Xsr.Runtime.Tests/Nexa.Xsr.Runtime.Tests.csproj \
            --configuration Release \
            -p:XsrVersionChannel=ci \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            --output "${{ runner.temp }}/xsr-runtime-aot"
          "${{ runner.temp }}/xsr-runtime-aot/Nexa.Xsr.Runtime.Tests"

      - name: Test UI.Next renderer kernel
        run: dotnet run --project tests/Nexa.Xsr.Renderer.Tests/Nexa.Xsr.Renderer.Tests.csproj --configuration Release --no-build

      - name: Test Avalonia scene backend
        run: dotnet run --project tests/Nexa.Xsr.Renderer.Backend.Avalonia.Tests/Nexa.Xsr.Renderer.Backend.Avalonia.Tests.csproj --configuration Release --no-build

      - name: Publish and run NativeAOT renderer tests
        run: |
          dotnet publish tests/Nexa.Xsr.Renderer.Tests/Nexa.Xsr.Renderer.Tests.csproj \
            --configuration Release \
            -p:XsrVersionChannel=ci \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            --output "${{ runner.temp }}/uinext-aot"
          "${{ runner.temp }}/uinext-aot/Nexa.Xsr.Renderer.Tests"

      - name: Test NXML compiler pipeline
        run: dotnet run --project tests/Nexa.Xsr.Renderer.Nxml.Tests/Nexa.Xsr.Renderer.Nxml.Tests.csproj --configuration Release --no-build

      - name: Publish and run NativeAOT NXML tests
        run: |
          dotnet publish tests/Nexa.Xsr.Renderer.Nxml.Tests/Nexa.Xsr.Renderer.Nxml.Tests.csproj \
            --configuration Release \
            -p:XsrVersionChannel=ci \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            --output "${{ runner.temp }}/pxml-aot"
          "${{ runner.temp }}/pxml-aot/Nexa.Xsr.Renderer.Nxml.Tests"

      - name: Test Sidecar protocol and transport
        run: dotnet run --project tests/Nexa.Sidecar.Tests/Nexa.Sidecar.Tests.csproj --configuration Release --no-build


      - name: Install Xvfb for the X11 probe smoke
        run: sudo apt-get install -y xvfb libx11-6

      - name: Test foundation services
        run: xvfb-run -a dotnet run --project tests/Nexa.Services.Tests/Nexa.Services.Tests.csproj --configuration Release --no-build

      - name: Test desktop composition
        run: dotnet run --project tests/Nexa.Desktop.Tests/Nexa.Desktop.Tests.csproj --configuration Release --no-build

      - name: Test NTP package and resource lifecycle
        run: dotnet run --project tests/Nexa.Services.Themes.Tests/Nexa.Services.Themes.Tests.csproj --configuration Release --no-build

      - name: Test reproducible NTP author packages
        run: |
          python -m unittest discover -s eng/themes -p 'test_*.py'
          python eng/themes/pack.py Nexa.Desktop/Themes/Minimal --output '${{ runner.temp }}/Nexa-Minimal.ntp'
          python eng/themes/pack.py Nexa.Desktop/Themes/Advanced --output '${{ runner.temp }}/Nexa-Advanced.ntp'
          python eng/themes/pack.py Nexa.Desktop/Themes --verify-published Nexa.Desktop/bin/Release/net10.0/Themes

      - name: Publish and run NativeAOT NTP services
        run: |
          dotnet publish tests/Nexa.Services.Themes.Tests/Nexa.Services.Themes.Tests.csproj \
            --configuration Release \
            -p:XsrVersionChannel=ci \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            --output "${{ runner.temp }}/theme-services-aot"
          "${{ runner.temp }}/theme-services-aot/Nexa.Services.Themes.Tests"

      - name: Smoke composition soak harness (not two-hour acceptance)
        run: |
          dotnet tests/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --soak idle --seconds 10 --output '${{ runner.temp }}/soak-idle'
          dotnet tests/Nexa.Desktop.Tests/bin/Release/net10.0/Nexa.Desktop.Tests.dll --soak navigation --seconds 10 --output '${{ runner.temp }}/soak-navigation'
          python eng/acceptance/analyze_soak.py --run-dir '${{ runner.temp }}/soak-idle' --output '${{ runner.temp }}/soak-idle-observations.json'
          python eng/acceptance/analyze_soak.py --run-dir '${{ runner.temp }}/soak-navigation' --output '${{ runner.temp }}/soak-navigation-observations.json'

      - name: Publish and run NativeAOT foundation tests
        run: |
          dotnet publish tests/Nexa.Services.Tests/Nexa.Services.Tests.csproj             --configuration Release             -p:XsrVersionChannel=ci             -p:PublishAot=true             -p:StripSymbols=true             --output "${{ runner.temp }}/foundation-aot"
          xvfb-run -a "${{ runner.temp }}/foundation-aot/Nexa.Services.Tests"

      - name: Enforce UI.Next benchmark gates
        run: dotnet run --project Nexa.Xsr.Renderer.Benchmarks/Nexa.Xsr.Renderer.Benchmarks.csproj --configuration Release --no-build

      - name: Validate real Minecraft evidence admission
        run: |
          python -m unittest discover -s eng/acceptance -p 'test_*.py'
          python eng/acceptance/verify.py --policy-only

      - name: Publish NativeAOT Minecraft benchmark harness
        run: dotnet publish tools/Nexa.Minecraft.Benchmarks -c Release -p:PublishAot=true -o "${{ runner.temp }}/minecraft-benchmark-aot"

      - name: Check benchmark input boundaries
        shell: pwsh
        run: ./eng/xsr/Test-MinecraftBenchmark.ps1 -Executable '${{ runner.temp }}/minecraft-benchmark-aot/Nexa.Minecraft.Benchmarks'

      - name: Enforce architecture boundaries
        run: dotnet run --project tests/Nexa.Xsr.ArchitectureTests/Nexa.Xsr.ArchitectureTests.csproj --configuration Release --no-build -- --repo-root .

      - name: Verify source formatting
        run: dotnet format NexaCL.slnx --no-restore --verify-no-changes --diagnostics IDE0055 IMPORTS

      - name: Publish and run NativeAOT Desktop shell smoke
        env:
          NexaCurseForgeApiKey: '$2a$10$NexaCurseForgeFixtureKeyForPublishSmoke'
        run: |
          dotnet publish Nexa.Desktop/Nexa.Desktop.csproj \
            --configuration Release \
            -p:XsrVersionChannel=ci \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:NexaMicrosoftClientId="${{ secrets.CLIENT_ID || secrets.MS_CLIENT_ID || secrets.NEXA_MS_CLIENT_ID || secrets.PCL_MS_CLIENT_ID }}" \
            -p:NexaLittleSkinClientId="${{ secrets.NEXA_LITTLESKIN_CLIENT_ID || secrets.PCL_LITTLESKIN_CLIENT_ID || secrets.LITTLESKIN_CLIENT_ID }}" \
            --output "${{ runner.temp }}/pcl-desktop-aot"
          "${{ runner.temp }}/pcl-desktop-aot/Nexa.Desktop" --validate-resource-credentials
          "${{ runner.temp }}/pcl-desktop-aot/Nexa.Desktop" --validate-shell

      - name: Run NativeAOT first-run shell smoke
        run: '"${{ runner.temp }}/pcl-desktop-aot/Nexa.Desktop" --validate-setup'

      - name: Run NativeAOT NTP activation smoke against published assets
        run: |
          python eng/themes/pack.py Nexa.Desktop/Themes --verify-published '${{ runner.temp }}/pcl-desktop-aot/Themes'
          "${{ runner.temp }}/pcl-desktop-aot/Nexa.Desktop" --validate-themes

      - name: Analyze trimmed desktop composition
        env:
          NexaCurseForgeApiKey: '$2a$10$NexaCurseForgeFixtureKeyForPublishSmoke'
        run: |
          dotnet publish Nexa.Desktop/Nexa.Desktop.csproj \
            --configuration Release \
            -p:XsrVersionChannel=ci \
            -p:PublishTrimmed=true \
            -p:TrimMode=link \
            --output "${{ runner.temp }}/pcl-desktop-trimmed"
          "${{ runner.temp }}/pcl-desktop-trimmed/Nexa.Desktop" --validate-resource-credentials

      - name: Run trimmed Desktop shell smoke
        run: '"${{ runner.temp }}/pcl-desktop-trimmed/Nexa.Desktop" --validate-shell'

      - name: Run trimmed first-run shell smoke
        run: '"${{ runner.temp }}/pcl-desktop-trimmed/Nexa.Desktop" --validate-setup'

      - name: Run trimmed NTP activation smoke against published assets
        run: |
          python eng/themes/pack.py Nexa.Desktop/Themes --verify-published '${{ runner.temp }}/pcl-desktop-trimmed/Themes'
          "${{ runner.temp }}/pcl-desktop-trimmed/Nexa.Desktop" --validate-themes

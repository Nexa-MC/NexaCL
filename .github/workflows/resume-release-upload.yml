name: Resume verified release upload
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable source release tag
        required: true
        type: string
      run_id:
        description: Launcher run that failed only at the final release upload
        required: true
        type: string
      release_id:
        description: Existing unpublished draft release ID
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: resume-release-upload-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  resume:
    if: github.repository == 'Nexa-MC/NexaCL' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN: ${{ inputs.run_id }}
      DRAFT_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test publisher contracts
        run: python -m unittest discover -s eng/release -p 'test_*.py'
      - name: Verify immutable source and upload-only failure
        run: python eng/release/resume_release_upload.py --tag "$RELEASE_TAG" --run-id "$SOURCE_RUN"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Complete-Nexa-distribution
          path: artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify every original signature and resume missing draft assets
        run: >-
          python eng/release/resume_release_upload.py --tag "$RELEASE_TAG"
          --run-id "$SOURCE_RUN" --release-id "$DRAFT_ID" --directory artifacts
